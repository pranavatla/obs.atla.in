name: Deploy Frontend to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      # Publish only the public page, never repository internals. The bucket is
      # served as-is by CloudFront, so anything synced here is downloadable.
      # --delete removes files left behind by earlier whole-repo uploads.
      - name: Stage public files
        run: |
          mkdir -p site
          cp index.html site/

      - name: Sync frontend to S3
        run: |
          aws s3 sync site/ s3://${{ vars.AWS_S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
